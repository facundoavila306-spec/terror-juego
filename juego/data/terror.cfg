fullscreen 1
// MEV 3D - ZONA MUERTA: arranca en el menu principal
maxdynlights 5
bind F [alternarlinterna]
bind E [usar]
bind M [mapa]
bind L [showgui lab]
killsendsp 0
invasion 0

alias musicamenu  [music "zm/menu.ogg"]
alias musicatramo [music "zm/tramo.ogg"]
alias musicacombate [music "zm/combate.ogg"]
alias cargarmapa [alias mapstart []; newmap 10; exec "data/terror_mapa.cfg"; dmsp terror1; musicatramo]
alias volvermenu [disconnect; musicamenu]
// un tramo se arma en caliente despues de que el motor crea el mapa vacio: por eso va en mapstart
alias cargartramo [
    invasion 0; killsendsp 0; iacreatura 1; forzarataque 0; animoverride 0
    tramoactual = $arg1
    alias mapstart [exec (format "data/tramos/%1.cfg" $tramoactual); armasbasicas; chapas 0; musicatramo; alias mapstart []]
    dmsp $arg1
]
alias jugar [cargartramo complejo]
alias laboratorio [invasion 0; killsendsp 0; iacreatura 1; animoverride 0; cargarmapa; echo "Tecla M: menu de criaturas"]

hudgunsdir "armas"
guixoff -300
guiyoff 150
guimainmax 48
newgui main [
    if $mainmenu [
        guiletrero "data/menu_jugar.png"     "jugar"                 7
        guiletrero "data/menu_lab.png"       "laboratorio"           10.5
        guiletrero "data/menu_opciones.png"  "showgui opciones"      9.5
        guiletrero "data/menu_creditos.png"  "showgui creditos"      9.5
        guiletrero "data/menu_salir.png"     "quit"                  6.5
    ] [
        guiletrero "data/pausa_continuar.png" "cleargui"          9.5
        guiletrero "data/pausa_opciones.png"  "showgui opciones"  9.5
        guiletrero "data/pausa_salir.png"     "volvermenu"        9.5
    ]
] 0

newgui opciones [
    guitext "OPCIONES"
    guibar
    guitext "Volumen de efectos"
    guislider soundvol 0 255
    guitext "Volumen de musica"
    guislider musicvol 0 255
    guitext "Campo de vision"
    guislider fov 60 120
    guibar
    guilist [
        guitext "Sensibilidad del mouse:  "
        guibutton "Baja"   [sensitivity 1.5]
        guibutton "Media"  [sensitivity 3]
        guibutton "Alta"   [sensitivity 6]
    ]
    guicheckbox "Pantalla completa" fullscreen
    guicheckbox "Mostrar FPS"       showfps
]

newgui creditos [
    guitext "ZONA MUERTA"
    guibar
    guitext "(c) 2026 Facundo - El Gallo McFlay"
    guitext "Todos los derechos reservados."
    guibar
    guitext "Motor: MEV 3D, base Cube 2 / Sauerbraten (licencia zlib)."
    guitext "Criaturas: Nuzluz, Nara, Nurrucapa, Nica, Naloma, Nakru."
]

newgui esqueleto [
    guitext "ESQUELETO Y MOVIMIENTO"
    guibar
    guicheckbox "Mostrar esqueleto (huesos y articulaciones)" esqueleto
    guicheckbox "Nombres de los huesos"                       esqnombres
    guicheckbox "Modo alambre (ver a traves del cuerpo)"      wireframe
    guicheckbox "Camara exterior (verme desde afuera)"        thirdperson
    guibar
    guitext "Velocidad del juego (10 = camara lenta, 100 = normal)"
    guislider velocidadjuego 10 100
    guibar
    guitext "Nurrucapa en la cara: distancia y luz"
    guislider garrapatadist 6 40
    guislider garrapataluz 0 100
    guibar
    guitext "ESC pausa el juego: sirve para mirar una pose quieta"
    guibar
    guibutton "Volver" "showgui lab"
]
newgui arma [
    guitext "POSICION DEL ARMA EN PANTALLA"
    guibar
    guitext "Adelante / atras"
    guislider armaadelante -40 40
    guitext "Derecha / izquierda"
    guislider armaderecha -40 40
    guitext "Abajo / arriba"
    guislider armaabajo -40 40
    guibar
    guibutton "Volver" "showgui lab"
]
newgui tienda [
    guitext (format "COMERCIANTE  -  tenes %1 chapas" $chapas)
    guibar
    guibutton "Bersa 9 mm: 17 balas  (6 chapas)"        [guistayopen [comprar 6 6 17]]
    guibutton "Bataan 71: 8 cartuchos  (10 chapas)"      [guistayopen [comprar 1 10 8]]
    guibutton "FMK-3: 32 balas  (10 chapas)"             [guistayopen [comprar 2 10 32]]
    guibutton "FAL: 20 balas  (18 chapas)"               [guistayopen [comprar 3 18 20]]
    guibutton "Mauser 1909: 5 balas  (14 chapas)"        [guistayopen [comprar 4 14 5]]
    guibutton "Granada FMK-2: 2  (12 chapas)"            [guistayopen [comprar 5 12 2]]
    guibar
    guibutton "Curarse 50  (8 chapas)"                   [guistayopen [comprarvida 8 50]]
    guibar
    guibutton "Listo" "cleargui"
]
newgui lab [
    guitext "MENU DE CRIATURAS  (tecla M)"
    guibar
    guibutton "Invocar criaturas.."   "showgui criaturas"
    guibutton "Ver animaciones.."     "showgui animaciones"
    guibutton "Comportamiento.."      "showgui comportamiento"
    guibutton "Luz y oscuridad.."     "showgui luz"
    guibutton "Ver esqueleto.."       "showgui esqueleto"
    guibar
    guibutton "Borrar todas las criaturas" "borrarcriaturas"
    guibutton "Curarme"                    "curarme"
    guibutton "Darme todas las armas"      "darmetodo"
    guibutton "Enterrar a los Nakru (prueba)" "enterrar"
    guibutton "Posicion del arma.."        "showgui arma"
    guibutton "Empezar de nuevo"           "cargarmapa"
    guibar
    guibutton "Volver al menu principal"    "volvermenu"
]

newgui criaturas [
    guitext "Aparecen delante tuyo. El menu queda abierto."
    guibar
    guibutton "Nuzluz   (infectado humano)"     [guistayopen [invocar 0]]
    guibutton "Nara   (jabali con bolsa de gas)" [guistayopen [invocar 1]]
    guibutton "Nurrucapa   (garrapata de cara)" [guistayopen [invocar 2]]
    guibutton "Nica   (gorila)"                  [guistayopen [invocar 3]]
    guibutton "Naloma   (condor)"                [guistayopen [invocar 4]]
    guibutton "Nakru   (gusano)"                 [guistayopen [invocar 5]]
    guibar
    guibutton "Una de cada una"         [guistayopen [invocartodas]]
    guibutton "Borrar todas"            [guistayopen [borrarcriaturas]]
]

newgui animaciones [
    guitext "Fuerza una animacion en TODAS las criaturas"
    guibar
    guibutton "Normal (la que les corresponde)" [guistayopen [animoverride 0]]
    guibutton "Quieto"      [guistayopen [animoverride 2]]
    guibutton "Corre"       [guistayopen [animoverride 3]]
    guibutton "Ataque 1"    [guistayopen [animoverride 14]]
    guibutton "Ataque 2"    [guistayopen [animoverride 15]]
    guibutton "Herido"      [guistayopen [animoverride 21]]
    guibutton "Salto"       [guistayopen [animoverride 22]]
    guibutton "Muriendo"    [guistayopen [animoverride 1]]
]

newgui comportamiento [
    guitext "Como se portan las criaturas"
    guibar
    guibutton "Quietas (no piensan ni atacan)"  [guistayopen [iacreatura 0]]
    guibutton "Activas (te persiguen y atacan)" [guistayopen [iacreatura 1]]
    guibar
    guibutton "Ataque al azar"        [guistayopen [forzarataque 0]]
    guibutton "Siempre ataque 1"      [guistayopen [forzarataque 1]]
    guibutton "Siempre ataque 2"      [guistayopen [forzarataque 2]]
    guibar
    guibutton "Oleadas automaticas SI" [guistayopen [invasion 1; echo "Se aplica con Empezar de nuevo"]]
    guibutton "Oleadas automaticas NO" [guistayopen [invasion 0; echo "Se aplica con Empezar de nuevo"]]
]

newgui luz [
    guitext "Luz y oscuridad"
    guibar
    guibutton "Linterna prendida / apagada (tecla F)" [guistayopen [alternarlinterna]]
    guibutton "Mapa mas claro"   [guistayopen [oscuridad 0; calclight -1]]
    guibutton "Mapa oscuro"      [guistayopen [oscuridad 60; calclight -1]]
]

musicamenu
