// MEV 3D - ZONA MUERTA: arranca en el menu principal
maxdynlights 5
bind F [alternarlinterna]
bind E [arrancar]
bind M [showgui lab]
killsendsp 0
invasion 0

alias cargarmapa [newmap 10; exec "data/terror_mapa.cfg"; dmsp terror1]
alias jugar [invasion 1; killsendsp 1; iacreatura 1; forzarataque 0; animoverride 0; cargarmapa]
alias laboratorio [invasion 0; killsendsp 0; iacreatura 1; animoverride 0; cargarmapa; echo "Tecla M: menu de criaturas"]

newgui main [
    if $mainmenu [
        guitext "MENU PRINCIPAL"
        guibar
        guibutton "JUGAR"                       "jugar"
        guibutton "LABORATORIO DE CRIATURAS"    "laboratorio"
        guibutton "OPCIONES"                    "showgui opciones"
        guibutton "CREDITOS"                    "showgui creditos"
        guibar
        guibutton "SALIR"                       "quit"
    ] [
        guitext "PAUSA"
        guibar
        guibutton "CONTINUAR"                   "cleargui"
        guibutton "MENU DE CRIATURAS"           "showgui lab"
        guibutton "OPCIONES"                    "showgui opciones"
        guibar
        guibutton "VOLVER AL MENU PRINCIPAL"    "disconnect"
    ]
]

newgui opciones [
    guitext "OPCIONES"
    guibar
    guitext "Volumen de efectos"
    guislider soundvol 0 255
    guitext "Volumen de musica"
    guislider musicvol 0 255
    guitext "Campo de vision"
    guislider fov 60 120
    guibar
    guilist [
        guitext "Sensibilidad del mouse:  "
        guibutton "Baja"   [sensitivity 1.5]
        guibutton "Media"  [sensitivity 3]
        guibutton "Alta"   [sensitivity 6]
    ]
    guicheckbox "Pantalla completa" fullscreen
    guicheckbox "Mostrar FPS"       showfps
]

newgui creditos [
    guitext "ZONA MUERTA"
    guibar
    guitext "(c) 2026 Facundo - El Gallo McFlay"
    guitext "Todos los derechos reservados."
    guibar
    guitext "Motor: MEV 3D, base Cube 2 / Sauerbraten (licencia zlib)."
    guitext "Criaturas: Nuzluz, Nara, Nurrucapa, Nica, Naloma, Nakru."
]

newgui lab [
    guitext "MENU DE CRIATURAS  (tecla M)"
    guibar
    guibutton "Invocar criaturas.."   "showgui criaturas"
    guibutton "Ver animaciones.."     "showgui animaciones"
    guibutton "Comportamiento.."      "showgui comportamiento"
    guibutton "Luz y oscuridad.."     "showgui luz"
    guibar
    guibutton "Borrar todas las criaturas" "borrarcriaturas"
    guibutton "Curarme"                    "curarme"
    guibutton "Empezar de nuevo"           "cargarmapa"
    guibar
    guibutton "Volver al menu principal"    "disconnect"
]

newgui criaturas [
    guitext "Aparecen delante tuyo. El menu queda abierto."
    guibar
    guibutton "Nuzluz   (infectado humano)"     [guistayopen [invocar 0]]
    guibutton "Nara   (jabali con bolsa de gas)" [guistayopen [invocar 1]]
    guibutton "Nurrucapa   (garrapata de cara)" [guistayopen [invocar 2]]
    guibutton "Nica   (gorila)"                  [guistayopen [invocar 3]]
    guibutton "Naloma   (condor)"                [guistayopen [invocar 4]]
    guibutton "Nakru   (gusano)"                 [guistayopen [invocar 5]]
    guibar
    guibutton "Una de cada una"         [guistayopen [invocartodas]]
    guibutton "Borrar todas"            [guistayopen [borrarcriaturas]]
]

newgui animaciones [
    guitext "Fuerza una animacion en TODAS las criaturas"
    guibar
    guibutton "Normal (la que les corresponde)" [guistayopen [animoverride 0]]
    guibutton "Quieto"      [guistayopen [animoverride 2]]
    guibutton "Corre"       [guistayopen [animoverride 3]]
    guibutton "Ataque 1"    [guistayopen [animoverride 14]]
    guibutton "Ataque 2"    [guistayopen [animoverride 15]]
    guibutton "Herido"      [guistayopen [animoverride 21]]
    guibutton "Salto"       [guistayopen [animoverride 22]]
    guibutton "Muriendo"    [guistayopen [animoverride 1]]
]

newgui comportamiento [
    guitext "Como se portan las criaturas"
    guibar
    guibutton "Quietas (no piensan ni atacan)"  [guistayopen [iacreatura 0]]
    guibutton "Activas (te persiguen y atacan)" [guistayopen [iacreatura 1]]
    guibar
    guibutton "Ataque al azar"        [guistayopen [forzarataque 0]]
    guibutton "Siempre ataque 1"      [guistayopen [forzarataque 1]]
    guibutton "Siempre ataque 2"      [guistayopen [forzarataque 2]]
    guibar
    guibutton "Oleadas automaticas SI" [guistayopen [invasion 1; echo "Se aplica con Empezar de nuevo"]]
    guibutton "Oleadas automaticas NO" [guistayopen [invasion 0; echo "Se aplica con Empezar de nuevo"]]
]

newgui luz [
    guitext "Luz y oscuridad"
    guibar
    guibutton "Linterna prendida / apagada (tecla F)" [guistayopen [alternarlinterna]]
    guibutton "Mapa mas claro"   [guistayopen [oscuridad 0; calclight -1]]
    guibutton "Mapa oscuro"      [guistayopen [oscuridad 60; calclight -1]]
]

