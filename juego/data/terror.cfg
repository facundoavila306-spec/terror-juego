// MEV 3D - juego de terror (v0.5): menu de pruebas en espanol
maxdynlights 5
bind F [alternarlinterna]
bind E [arrancar]
bind M [showgui main]
killsendsp 0       // el mapa no termina al matar todo
invasion 0         // no salen criaturas solas: las invocas vos desde el menu

newgui main [
    guitext "MENU DE PRUEBAS  (tecla M o ESC)"
    guibar
    guibutton "Invocar criaturas.."   "showgui criaturas"
    guibutton "Ver animaciones.."     "showgui animaciones"
    guibutton "Comportamiento.."      "showgui comportamiento"
    guibutton "Luz y oscuridad.."     "showgui luz"
    guibar
    guibutton "Borrar todas las criaturas" "borrarcriaturas"
    guibutton "Curarme"                    "curarme"
    guibutton "Empezar de nuevo"           "dmsp terror1"
    guibar
    guibutton "Salir del juego"            "quit"
]

newgui criaturas [
    guitext "Aparecen delante tuyo. El menu queda abierto."
    guibar
    guibutton "Nuzluz   (infectado humano)"     [guistayopen [invocar 0]]
    guibutton "Nara   (jabali con bolsa de gas)" [guistayopen [invocar 1]]
    guibutton "Nurrucapa   (garrapata de cara)" [guistayopen [invocar 2]]
    guibutton "Nica   (gorila)"                  [guistayopen [invocar 3]]
    guibutton "Naloma   (condor)"                [guistayopen [invocar 4]]
    guibutton "Nakru   (gusano)"                 [guistayopen [invocar 5]]
    guibar
    guibutton "Una de cada una"         [guistayopen [invocartodas]]
    guibutton "Borrar todas"            [guistayopen [borrarcriaturas]]
]

newgui animaciones [
    guitext "Fuerza una animacion en TODAS las criaturas"
    guibar
    guibutton "Normal (la que les corresponde)" [guistayopen [animoverride 0]]
    guibutton "Quieto"      [guistayopen [animoverride 2]]
    guibutton "Corre"       [guistayopen [animoverride 3]]
    guibutton "Ataque 1"    [guistayopen [animoverride 14]]
    guibutton "Ataque 2"    [guistayopen [animoverride 15]]
    guibutton "Herido"      [guistayopen [animoverride 21]]
    guibutton "Salto"       [guistayopen [animoverride 22]]
    guibutton "Muriendo"    [guistayopen [animoverride 1]]
]

newgui comportamiento [
    guitext "Como se portan las criaturas"
    guibar
    guibutton "Quietas (no piensan ni atacan)"  [guistayopen [iacreatura 0]]
    guibutton "Activas (te persiguen y atacan)" [guistayopen [iacreatura 1]]
    guibar
    guibutton "Ataque al azar"        [guistayopen [forzarataque 0]]
    guibutton "Siempre ataque 1"      [guistayopen [forzarataque 1]]
    guibutton "Siempre ataque 2"      [guistayopen [forzarataque 2]]
    guibar
    guibutton "Oleadas automaticas SI" [guistayopen [invasion 1; echo "Reinicia con Empezar de nuevo"]]
    guibutton "Oleadas automaticas NO" [guistayopen [invasion 0; echo "Reinicia con Empezar de nuevo"]]
]

newgui luz [
    guitext "Luz y oscuridad"
    guibar
    guibutton "Linterna prendida / apagada (tecla F)" [guistayopen [alternarlinterna]]
    guibutton "Mapa mas claro"   [guistayopen [oscuridad 0; calclight -1]]
    guibutton "Mapa oscuro"      [guistayopen [oscuridad 60; calclight -1]]
]

newmap 10
exec "data/terror_mapa.cfg"
dmsp terror1
