objetivo "Entra a la comisaria. El deposito de armas esta cerrado: busca las 3 llaves"
alias llave_tomada [ llaves (+ $llaves 1); borrarusable $arg1; sumarchapas 15; sound 9; if (>= $llaves 3) [objetivo "Tenes las 3 llaves. El deposito esta al fondo del pasillo de calabozos, a la derecha"] [objetivo (format "Llaves del deposito de armas: %1/3" $llaves)] ]
ttusar llave1 768 256 74 "Llave del deposito (escritorio del comisario)" [llave_tomada llave1] "objetos/llave"
ttusar llave2 580 512 74 "Llave del deposito (bajo el catre, calabozo 4)" [llave_tomada llave2; emboscada_celdas] "objetos/llave"
ttusar llave3 208 504 90 "Llave del deposito (guantera de la chata)" [llave_tomada llave3; emboscada_patio] "objetos/llave"
alias emboscada_celdas [ aparecer 0 384 424 68 0; aparecer 0 656 424 68 0; aparecer 2 384 432 68 0; aparecer 2 656 432 68 0; echo "Se escuchan pasos en el pasillo..." ]
alias emboscada_patio [ aparecer 0 232 344 68 0; aparecer 0 352 424 68 0; aparecer 1 352 416 68 0; echo "Vienen del edificio!" ]
alias abrir_deposito [ if (>= $llaves 3) [ ttcavar 86 52 8 4 3 3; ttfin; patchlight 1; borrarusable deposito; sumarchapas 40; sound 8; objetivo "Deposito abierto. Habla con el comerciante (E) y sali por el porton del fondo" ] [ echo "Esta cerrado con llave. Te faltan llaves"; sound 15 ] ]
ttusar deposito 700 428 76 "Puerta del deposito de armas" [abrir_deposito] ""
ttusar comerciante 808 408 74 "Comerciante" [showgui tienda] "objetos/farol"
ttusar botiquin1 728 384 78 "Botiquin" [comprarvida 0 50; borrarusable botiquin1] "objetos/botiquin"
ttusar balas1 728 424 74 "Caja de balas 9 mm" [comprar 6 0 34; borrarusable balas1] "objetos/caja_balas"
alias abrir_porton [ ttcavar 106 49 8 4 3 4; ttfin; patchlight 1; borrarusable porton; objetivo "Sali por el callejon: al fondo, a la derecha"; sound 8 ]
ttusar porton 852 404 76 "Porton del fondo (abrir)" [abrir_porton] ""
alias fin_tramo [ tramocompleto "SALIERON DE LA COMISARIA"; sound 9; sleep 5000 [volvermenu] ]
ttzona salida 936 608 72 24 [fin_tramo] 0
calclight 1
